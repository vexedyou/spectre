<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectre</title>
  <meta name="description" content="Spectre" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #e4e4e7; /* bright zinc grey */
      color: #18181b;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    /* Soft ambient background */
    .bg-layer {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,255,255,0.7), transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(244,244,245,0.9), transparent 50%),
        linear-gradient(160deg, #f4f4f5 0%, #e4e4e7 40%, #d4d4d8 100%);
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 60;
    }

    /* Strong glass */
    .glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .glass-deep {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08),
        0 4px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    /* Screens */
    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: opacity 1.1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1.1s;
    }

    .screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Intro title */
    #intro-screen .title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      color: #27272a;
      text-shadow: 0 2px 40px rgba(255,255,255,0.5);
      opacity: 0;
      transform: translateY(18px) scale(0.98);
      animation: titleIn 1.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s forwards;
    }

    @keyframes titleIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Login screen starts invisible */
    #login-screen {
      opacity: 0;
      visibility: hidden;
    }

    #login-screen.visible {
      opacity: 1;
      visibility: visible;
    }

    .login-card {
      width: min(100%, 400px);
      padding: 2.5rem 2.25rem;
      border-radius: 1.75rem;
      transform: translateY(24px);
      opacity: 0;
      transition: transform 0.9s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #login-screen.visible .login-card {
      transform: translateY(0);
      opacity: 1;
    }

    input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      font-size: 0.925rem;
      color: #18181b;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    input::placeholder {
      color: #a1a1aa;
    }

    input:focus {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(113, 113, 122, 0.4);
      box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.12);
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 0.9rem;
      background: #27272a;
      color: #fafafa;
      font-weight: 500;
      font-size: 0.925rem;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    .btn-primary:hover {
      background: #18181b;
      box-shadow: 0 6px 20px rgba(0,0,0,0.16);
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #a1a1aa;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(113, 113, 122, 0.25);
    }

    .link {
      color: #52525b;
      text-decoration: none;
      font-size: 0.8125rem;
      transition: color 0.15s;
    }

    .link:hover {
      color: #18181b;
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="noise"></div>

  <!-- INTRO: Spectre -->
  <div id="intro-screen" class="screen">
    <h1 class="title">Spectre</h1>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card glass-deep">
      <div class="text-center mb-8">
        <h2 class="font-serif italic text-3xl text-zinc-800 tracking-tight">Spectre</h2>
        <p class="mt-2 text-sm text-zinc-500">Sign in to continue</p>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-medium text-zinc-500 mb-1.5 ml-0.5">Email</label>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium text-zinc-500 ml-0.5">Password</label>
            <a href="#" class="link">Forgot?</a>
          </div>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn-primary mt-2">
          Continue
        </button>
      </form>

      <div class="divider my-6">or</div>

      <button type="button" class="w-full py-2.5 rounded-xl glass text-sm font-medium text-zinc-700 hover:bg-white/60 transition flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="opacity-70"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <p class="mt-7 text-center text-xs text-zinc-500">
        No account yet? <a href="#" class="link font-medium">Request access</a>
      </p>
    </div>
  </div>

  <script>
    const intro = document.getElementById('intro-screen');
    const login = document.getElementById('login-screen');

    // Sequence: show title → hold → fade out → reveal login
    setTimeout(() => {
      intro.classList.add('hidden');
    }, 2200);

    setTimeout(() => {
      login.classList.add('visible');
    }, 2800);

    function handleLogin(e) {
      e.preventDefault();
      // Placeholder — next step is the dashboard
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Entering…';
      btn.disabled = true;
      // Later: route into dashboard
    }
  </script>
</body>
</html>
