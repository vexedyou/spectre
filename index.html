<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #e4e4e7;
      color: #18181b;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,255,255,0.7), transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(244,244,245,0.9), transparent 50%),
        linear-gradient(160deg, #f4f4f5 0%, #e4e4e7 40%, #d4d4d8 100%);
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 60;
    }

    .glass-header {
      background: rgba(255, 255, 255, 0.62);
      backdrop-filter: blur(48px) saturate(1.55);
      -webkit-backdrop-filter: blur(48px) saturate(1.55);
      border: 1px solid rgba(255, 255, 255, 0.82);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.06),
        0 2px 8px rgba(0, 0, 0, 0.03),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.38);
      backdrop-filter: blur(24px) saturate(1.35);
      -webkit-backdrop-filter: blur(24px) saturate(1.35);
      border: 1px solid rgba(255, 255, 255, 0.58);
      box-shadow:
        0 4px 20px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }
    .glass-deep {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08),
        0 4px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }
    .glass-soft {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }
    .glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Intro */
    #intro-screen {
      flex-direction: column;
      gap: 3.5rem;
    }

    #intro-screen .title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      color: #27272a;
      text-shadow: 0 2px 40px rgba(255,255,255,0.5);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      will-change: opacity, transform;
    }

    #intro-screen.title-in .title {
      animation: titleIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    #intro-screen.title-out .title {
      animation: titleOut 1.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes titleOut {
      to { opacity: 0; transform: translateY(-16px) scale(1.02); filter: blur(6px); }
    }

    /* Loader — real progress */
    .loader-wrap {
      width: min(280px, 70vw);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .loader-wrap.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .loader-track {
      height: 2px;
      background: rgba(113, 113, 122, 0.2);
      border-radius: 9999px;
      overflow: hidden;
    }

    .loader-fill {
      height: 100%;
      width: 0%;
      background: #3f3f46;
      border-radius: 9999px;
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .loader-meta {
      display: flex;
      justify-content: space-between;
      margin-top: 0.65rem;
      font-size: 0.7rem;
      letter-spacing: 0.04em;
      color: #a1a1aa;
      text-transform: uppercase;
    }

    /* Login */
    #login-screen {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible { opacity: 1; pointer-events: auto; }
    #login-screen.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-card {
      width: min(100%, 400px);
      padding: 2.5rem 2.25rem;
      border-radius: 1.75rem;
      transform: translateY(36px) scale(0.97);
      opacity: 0;
      filter: blur(8px);
      will-change: transform, opacity, filter;
      transition:
        transform 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible .login-card {
      transform: translateY(0) scale(1);
      opacity: 1;
      filter: blur(0);
    }
    .login-card > * {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible .login-card > * { opacity: 1; transform: translateY(0); }
    #login-screen.visible .login-card > *:nth-child(1) { transition-delay: 0.25s; }
    #login-screen.visible .login-card > *:nth-child(2) { transition-delay: 0.35s; }
    #login-screen.visible .login-card > *:nth-child(3) { transition-delay: 0.45s; }
    #login-screen.visible .login-card > *:nth-child(4) { transition-delay: 0.55s; }
    #login-screen.visible .login-card > *:nth-child(5) { transition-delay: 0.65s; }

    input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      font-size: 0.925rem;
      color: #18181b;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    input::placeholder { color: #a1a1aa; }
    input:focus {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(113, 113, 122, 0.4);
      box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.12);
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 0.9rem;
      background: #27272a;
      color: #fafafa;
      font-weight: 500;
      font-size: 0.925rem;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    .btn-primary:hover { background: #18181b; box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
    .btn-primary:active { transform: scale(0.985); }
    .btn-primary:disabled { opacity: 0.7; cursor: wait; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #a1a1aa;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(113, 113, 122, 0.25);
    }

    .link {
      color: #52525b;
      text-decoration: none;
      font-size: 0.8125rem;
      transition: color 0.2s ease;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
    }
    .link:hover { color: #18181b; }

    /* Dashboard */
    #dashboard-screen {
      opacity: 0;
      pointer-events: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #dashboard-screen.visible { opacity: 1; pointer-events: auto; }

    .dash-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1.75rem 1.5rem;
      gap: 1.5rem;
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.4rem;
      border-radius: 1.35rem;
      flex-shrink: 0;
    }

    .section-label { padding: 0 0.35rem; }
    .section-label h1 {
      font-size: 1.35rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: #27272a;
    }
    .section-label p {
      margin-top: 0.2rem;
      font-size: 0.875rem;
      color: #71717a;
    }

    .host-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.15rem;
      overflow-y: auto;
      padding: 0.35rem 0.15rem 1rem;
      flex: 1;
      align-content: start;
    }

    .host-card {
      border-radius: 1.4rem;
      padding: 1.4rem 1.45rem 1.3rem;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(16px);
      animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition:
        transform 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        background 0.35s ease,
        box-shadow 0.45s cubic-bezier(0.16, 1, 0.3, 1),
        border-color 0.35s ease;
    }
    @keyframes cardIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .host-card:hover {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.55);
      border-color: rgba(255, 255, 255, 0.85);
      box-shadow:
        0 18px 44px rgba(0, 0, 0, 0.09),
        0 6px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    .host-card:active { transform: translateY(-2px) scale(0.995); }

    .host-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 1.15rem;
    }
    .host-identity {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }
    .host-name {
      font-weight: 500;
      font-size: 0.95rem;
      letter-spacing: -0.015em;
      color: #18181b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .host-status-label {
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #a1a1aa;
      padding-top: 0.15rem;
    }
    .host-meta {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .host-os {
      font-size: 0.8125rem;
      color: #52525b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .host-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8125rem;
      color: #71717a;
    }
    .host-user { color: #a1a1aa; }
    .host-footer {
      margin-top: 1rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(113, 113, 122, 0.12);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #a1a1aa;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 9999px;
      flex-shrink: 0;
      position: relative;
    }
    .status-online {
      background: #34d399;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.22);
    }
    .status-online::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 9999px;
      border: 1.5px solid rgba(52, 211, 153, 0.45);
      animation: pulse-ring 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    .status-idle {
      background: #fbbf24;
      box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.22);
    }
    .status-offline {
      background: #a1a1aa;
      box-shadow: 0 0 0 3px rgba(161, 161, 170, 0.18);
      opacity: 0.85;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.85); opacity: 0.7; }
      70% { transform: scale(1.35); opacity: 0; }
      100% { transform: scale(1.35); opacity: 0; }
    }

    #host-screen {
      opacity: 0;
      pointer-events: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #host-screen.visible { opacity: 1; pointer-events: auto; }

    .cmd-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 1rem 1.15rem;
      border-radius: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease;
      border: none;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .cmd-btn:hover {
      background: rgba(255, 255, 255, 0.55);
      transform: translateY(-1px);
    }
    .cmd-btn:active { transform: scale(0.99); }

    .output-panel {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #3f3f46;
      white-space: pre-wrap;
      min-height: 140px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      color: #52525b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
      font-family: inherit;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.5);
      color: #18181b;
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="noise"></div>

  <audio id="intro-audio" preload="auto" playsinline></audio>

  <!-- INTRO -->
  <div id="intro-screen" class="screen">
    <h1 class="title">Spectre</h1>
    <div class="loader-wrap" id="loader-wrap">
      <div class="loader-track">
        <div class="loader-fill" id="loader-fill"></div>
      </div>
      <div class="loader-meta">
        <span id="loader-label">Loading assets</span>
        <span id="loader-pct">0%</span>
      </div>
    </div>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card glass-deep">
      <div class="text-center mb-8">
        <h2 class="font-serif italic text-3xl text-zinc-800 tracking-tight">Spectre</h2>
        <p class="mt-2 text-sm text-zinc-500">Sign in to continue</p>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-medium text-zinc-500 mb-1.5 ml-0.5">Email</label>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" value="operator@spectre.local" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium text-zinc-500 ml-0.5">Password</label>
            <a href="#" class="link">Forgot?</a>
          </div>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password" value="spectre" />
        </div>
        <button type="submit" class="btn-primary mt-2">Continue</button>
      </form>

      <div class="divider my-6">or</div>

      <button type="button" class="w-full py-2.5 rounded-xl glass text-sm font-medium text-zinc-700 hover:bg-white/60 transition flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="opacity-70"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <p class="mt-7 text-center text-xs text-zinc-500">Demo: any credentials work · prefilled for speed</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard-screen" class="screen">
    <div class="dash-shell">
      <header class="dash-header glass-header">
        <div class="flex items-center gap-3">
          <span class="font-serif italic text-xl text-zinc-800 tracking-tight">Spectre</span>
          <span class="text-[11px] font-medium text-zinc-500 px-2.5 py-1 rounded-full glass-soft tracking-wide">operator</span>
        </div>
        <div class="flex items-center gap-5 text-sm text-zinc-500">
          <span class="flex items-center gap-1.5">
            <span class="status-dot status-online" style="width:7px;height:7px"></span>
            <span id="online-count">3</span> online
          </span>
          <button onclick="logout()" class="link">Sign out</button>
        </div>
      </header>

      <div class="section-label">
        <h1>Hosts</h1>
        <p>Clients under control</p>
      </div>

      <div class="host-grid" id="host-grid"></div>
    </div>
  </div>

  <!-- HOST DETAIL -->
  <div id="host-screen" class="screen">
    <div class="dash-shell">
      <header class="dash-header glass-header">
        <div class="flex items-center gap-3">
          <button class="back-btn" onclick="backToHosts()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            Hosts
          </button>
          <div class="h-4 w-px bg-zinc-300/80"></div>
          <div class="flex items-center gap-2.5">
            <span id="host-status-dot" class="status-dot status-online"></span>
            <span id="host-name" class="font-medium text-zinc-800 tracking-tight">—</span>
          </div>
        </div>
        <div class="text-sm text-zinc-500" id="host-meta">—</div>
      </header>

      <div class="flex-1 grid lg:grid-cols-[1fr_1.1fr] gap-4 min-h-0 overflow-hidden">
        <div class="glass-deep rounded-2xl p-5 flex flex-col min-h-0 overflow-hidden">
          <h2 class="text-sm font-medium text-zinc-600 mb-3">Commands</h2>
          <div class="grid sm:grid-cols-2 gap-2 overflow-y-auto pr-1" id="cmd-grid"></div>
        </div>
        <div class="glass-deep rounded-2xl p-5 flex flex-col min-h-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-medium text-zinc-600">Output</h2>
            <button onclick="clearOutput()" class="text-xs text-zinc-400 hover:text-zinc-600 transition">Clear</button>
          </div>
          <div class="glass-soft rounded-xl p-4 flex-1 overflow-y-auto">
            <div class="output-panel" id="output">Ready. Select a command.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Real asset loader ───────────────────────────────────────
    const assets = [
      { id: 'fonts', label: 'Typography', weight: 15 },
      { id: 'audio', label: 'Intro audio', weight: 45 },
      { id: 'manifest', label: 'Manifest', weight: 15 },
      { id: 'icons', label: 'Interface', weight: 15 },
      { id: 'ready', label: 'Finalizing', weight: 10 }
    ];

    let progress = 0;
    const fill = document.getElementById('loader-fill');
    const pctEl = document.getElementById('loader-pct');
    const labelEl = document.getElementById('loader-label');
    const loaderWrap = document.getElementById('loader-wrap');
    const introScreen = document.getElementById('intro-screen');
    const audioEl = document.getElementById('intro-audio');

    function setProgress(p, label) {
      progress = Math.min(100, Math.max(progress, p));
      fill.style.width = progress + '%';
      pctEl.textContent = Math.round(progress) + '%';
      if (label) labelEl.textContent = label;
    }

    function loadFonts() {
      return document.fonts.ready.then(() => {
        // Force Instrument Serif + Inter to resolve
        return Promise.all([
          document.fonts.load('400 48px "Instrument Serif"'),
          document.fonts.load('italic 400 48px "Instrument Serif"'),
          document.fonts.load('400 16px Inter'),
          document.fonts.load('500 16px Inter')
        ]);
      });
    }

    function loadAudio() {
      return new Promise((resolve) => {
        audioEl.src = 'assets/intro.mp3';
        let settled = false;
        const done = () => {
          if (settled) return;
          settled = true;
          resolve();
        };

        audioEl.addEventListener('canplaythrough', done, { once: true });
        audioEl.addEventListener('error', done, { once: true });

        // Track download progress when available
        fetch('assets/intro.mp3')
          .then(async (res) => {
            if (!res.ok) throw new Error('missing');
            const reader = res.body.getReader();
            const total = +res.headers.get('content-length') || 140000;
            let received = 0;
            while (true) {
              const { done: d, value } = await reader.read();
              if (d) break;
              received += value.length;
              const ratio = Math.min(1, received / total);
              // audio is ~45% of total bar, fonts already counted
              setProgress(15 + ratio * 40, 'Intro audio');
            }
            // Ensure decode
            audioEl.load();
          })
          .catch(() => {
            // File missing — still continue so UI isn't blocked
            setProgress(55, 'Intro audio');
            done();
          });

        // Safety timeout
        setTimeout(done, 8000);
      });
    }

    function loadManifest() {
      // Small real JSON payload (could be host seed later)
      const data = JSON.stringify({
        version: '0.1.0',
        codename: 'spectre',
        hosts: 5,
        build: Date.now()
      });
      return new Promise((resolve) => {
        // Simulate parsing / storing
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        fetch(url).then(r => r.json()).then(() => {
          URL.revokeObjectURL(url);
          resolve();
        });
      });
    }

    function loadIcons() {
      // Decode a few inline SVG data-URLs (real work for the browser)
      const svgs = [
        'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="12" fill="%2334d399"/></svg>'),
        'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="8" fill="%23a1a1aa"/></svg>'),
        'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><path d="M12 2L2 7l10 5 10-5-10-5z" fill="%2327272a"/></svg>')
      ];
      return Promise.all(svgs.map(src => new Promise((res) => {
        const img = new Image();
        img.onload = img.onerror = () => res();
        img.src = src;
      })));
    }

    async function runLoader() {
      loaderWrap.classList.add('visible');
      introScreen.classList.add('title-in');

      // Start audio as early as policy allows (may need gesture on some browsers)
      try {
        audioEl.volume = 0.55;
        const playPromise = audioEl.play();
        if (playPromise) playPromise.catch(() => {});
      } catch (_) {}

      setProgress(2, 'Typography');
      await loadFonts();
      setProgress(15, 'Typography');

      setProgress(16, 'Intro audio');
      await loadAudio();
      setProgress(60, 'Intro audio');

      // Try play again once buffered
      try { await audioEl.play(); } catch (_) {}

      setProgress(62, 'Manifest');
      await loadManifest();
      setProgress(75, 'Manifest');

      setProgress(78, 'Interface');
      await loadIcons();
      setProgress(90, 'Interface');

      setProgress(92, 'Finalizing');
      await new Promise(r => setTimeout(r, 400));
      setProgress(100, 'Ready');

      // Hold a beat on 100% so the last of the intro can breathe
      await new Promise(r => setTimeout(r, 900));

      introScreen.classList.add('title-out');
      loaderWrap.style.opacity = '0';

      await new Promise(r => setTimeout(r, 1200));

      // Fade audio out gently into login
      fadeAudioOut();

      document.getElementById('login-screen').classList.add('visible');
    }

    function fadeAudioOut() {
      if (!audioEl) return;
      const start = audioEl.volume;
      const steps = 24;
      let i = 0;
      const tick = () => {
        i++;
        audioEl.volume = Math.max(0, start * (1 - i / steps));
        if (i < steps) requestAnimationFrame(tick);
        else {
          audioEl.pause();
          audioEl.currentTime = 0;
        }
      };
      requestAnimationFrame(tick);
    }

    // Kick off after a frame so CSS is ready
    requestAnimationFrame(() => runLoader());

    // ── Rest of app (unchanged logic) ───────────────────────────
    const hosts = [
      { id: 'h1', name: 'WORKSTATION-04', os: 'Windows 11 Pro', ip: '10.0.14.22', user: 'j.miller', status: 'online', lastSeen: 'Just now', latency: '18 ms' },
      { id: 'h2', name: 'macbook-pro-m2', os: 'macOS Sequoia', ip: '10.0.14.41', user: 'a.chen', status: 'online', lastSeen: '12s ago', latency: '24 ms' },
      { id: 'h3', name: 'ubuntu-build-07', os: 'Ubuntu 24.04 LTS', ip: '10.0.15.8', user: 'deploy', status: 'online', lastSeen: 'Just now', latency: '11 ms' },
      { id: 'h4', name: 'DESKTOP-FINANCE', os: 'Windows 10 Enterprise', ip: '10.0.12.90', user: 'r.patel', status: 'idle', lastSeen: '4m ago', latency: '—' },
      { id: 'h5', name: 'lab-pi-03', os: 'Raspberry Pi OS', ip: '10.0.20.3', user: 'pi', status: 'offline', lastSeen: '2h ago', latency: '—' }
    ];

    const commands = [
      { id: 'sysinfo', label: 'System info', desc: 'OS, CPU, memory, uptime' },
      { id: 'shell', label: 'Shell', desc: 'Open interactive shell' },
      { id: 'screenshot', label: 'Screenshot', desc: 'Capture current display' },
      { id: 'processes', label: 'Processes', desc: 'List running processes' },
      { id: 'files', label: 'File browser', desc: 'Browse remote filesystem' },
      { id: 'net', label: 'Network', desc: 'Interfaces, connections' },
      { id: 'clipboard', label: 'Clipboard', desc: 'Read remote clipboard' },
      { id: 'keylog', label: 'Input log', desc: 'Keystroke buffer (placeholder)' },
      { id: 'persist', label: 'Persistence', desc: 'Check / manage implants' },
      { id: 'transfer', label: 'Transfer', desc: 'Upload / download files' }
    ];

    const fakeOutputs = {
      sysinfo: `Hostname: {{name}}\nOS:        {{os}}\nUser:      {{user}}\nIP:        {{ip}}\nUptime:    14h 22m\nCPU:       12% · 8 cores\nMemory:    6.4 / 16 GB\nDisk:      128 GB free`,
      shell: `$ whoami\n{{user}}\n$ pwd\n/home/{{user}}\n$ # interactive shell placeholder`,
      screenshot: `[screenshot] Captured primary display (1920×1080)\nSaved → /tmp/spectre_shot_{{id}}.png\n(placeholder — no real capture)`,
      processes: `PID   NAME              CPU    MEM\n1284  explorer.exe      0.4%   48M\n2401  chrome.exe        12%    610M\n3012  Code.exe          3.1%   290M\n… (placeholder list)`,
      files: `/home/{{user}}\n  Documents/\n  Downloads/\n  .config/\n  notes.txt\n(placeholder file tree)`,
      net: `eth0  {{ip}}  up\ntcp   443  established  ×4\ntcp   22   listening\n(placeholder)`,
      clipboard: `[clipboard] "meeting notes – Q4 roadmap"\n(placeholder)`,
      keylog: `[input] buffer empty · last activity 2m ago\n(placeholder)`,
      persist: `Implant: spectre-agent v0.1\nStatus:  running\nMethod:  (placeholder)\nLast check-in: {{lastSeen}}`,
      transfer: `Ready for transfer.\nDrag files here or use put / get.\n(placeholder)`
    };

    let currentHost = null;
    const login = document.getElementById('login-screen');
    const dash = document.getElementById('dashboard-screen');
    const hostScreen = document.getElementById('host-screen');

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Entering…';
      btn.disabled = true;
      setTimeout(() => {
        login.classList.add('fade-out');
        setTimeout(() => {
          login.classList.remove('visible', 'fade-out');
          login.style.display = 'none';
          introScreen.style.display = 'none';
          renderHosts();
          dash.classList.add('visible');
        }, 700);
      }, 600);
    }

    function logout() { location.reload(); }

    function renderHosts() {
      const grid = document.getElementById('host-grid');
      document.getElementById('online-count').textContent = hosts.filter(h => h.status === 'online').length;
      grid.innerHTML = hosts.map((h, i) => `
        <div class="host-card glass-card" style="animation-delay: ${0.08 + i * 0.07}s" onclick="openHost('${h.id}')">
          <div class="host-card-top">
            <div class="host-identity">
              <span class="status-dot status-${h.status}"></span>
              <span class="host-name">${h.name}</span>
            </div>
            <span class="host-status-label">${h.status}</span>
          </div>
          <div class="host-meta">
            <div class="host-os">${h.os}</div>
            <div class="host-row">
              <span>${h.ip}</span>
              <span class="host-user">${h.user}</span>
            </div>
          </div>
          <div class="host-footer">
            <span>${h.lastSeen}</span>
            <span>${h.latency !== '—' ? h.latency : ''}</span>
          </div>
        </div>
      `).join('');
    }

    function openHost(id) {
      currentHost = hosts.find(h => h.id === id);
      if (!currentHost) return;
      document.getElementById('host-name').textContent = currentHost.name;
      document.getElementById('host-meta').textContent = `${currentHost.os} · ${currentHost.ip} · ${currentHost.user}`;
      document.getElementById('host-status-dot').className = `status-dot status-${currentHost.status}`;
      document.getElementById('cmd-grid').innerHTML = commands.map(c => `
        <button class="cmd-btn glass-soft" onclick="runCommand('${c.id}')">
          <span class="font-medium text-zinc-800 text-sm">${c.label}</span>
          <span class="text-xs text-zinc-500">${c.desc}</span>
        </button>
      `).join('');
      document.getElementById('output').textContent = 'Ready. Select a command.';
      dash.classList.remove('visible');
      setTimeout(() => hostScreen.classList.add('visible'), 200);
    }

    function backToHosts() {
      hostScreen.classList.remove('visible');
      setTimeout(() => dash.classList.add('visible'), 200);
    }

    function runCommand(id) {
      const tpl = fakeOutputs[id] || 'Command acknowledged (placeholder).';
      const h = currentHost;
      const text = tpl
        .replaceAll('{{name}}', h.name)
        .replaceAll('{{os}}', h.os)
        .replaceAll('{{user}}', h.user)
        .replaceAll('{{ip}}', h.ip)
        .replaceAll('{{id}}', h.id)
        .replaceAll('{{lastSeen}}', h.lastSeen);
      const out = document.getElementById('output');
      out.textContent = 'Running…';
      setTimeout(() => { out.textContent = text; }, 350 + Math.random() * 400);
    }

    function clearOutput() {
      document.getElementById('output').textContent = 'Ready. Select a command.';
    }
  </script>
</body>
</html>
