<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spectre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Instrument Serif', 'Georgia', 'serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      background: #e4e4e7;
      color: #18181b;
      font-family: Inter, system-ui, sans-serif;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(255,255,255,0.7), transparent 50%),
        radial-gradient(ellipse 70% 50% at 80% 80%, rgba(244,244,245,0.9), transparent 50%),
        linear-gradient(160deg, #f4f4f5 0%, #e4e4e7 40%, #d4d4d8 100%);
      z-index: 0;
    }

    .noise {
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 60;
    }

    .glass {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(28px) saturate(1.4);
      -webkit-backdrop-filter: blur(28px) saturate(1.4);
      border: 1px solid rgba(255, 255, 255, 0.65);
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .glass-deep {
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(40px) saturate(1.5);
      -webkit-backdrop-filter: blur(40px) saturate(1.5);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.08),
        0 4px 16px rgba(0, 0, 0, 0.04),
        inset 0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .glass-soft {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      border: 1px solid rgba(255, 255, 255, 0.55);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Intro */
    #intro-screen .title {
      font-family: 'Instrument Serif', Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      letter-spacing: -0.03em;
      color: #27272a;
      text-shadow: 0 2px 40px rgba(255,255,255,0.5);
      opacity: 0;
      transform: translateY(28px) scale(0.96);
      will-change: opacity, transform;
      animation:
        titleIn 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards,
        titleOut 1.6s cubic-bezier(0.4, 0, 0.2, 1) 2.6s forwards;
    }

    @keyframes titleIn {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes titleOut {
      to { opacity: 0; transform: translateY(-16px) scale(1.02); filter: blur(6px); }
    }

    /* Login */
    #login-screen {
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #login-screen.fade-out {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .login-card {
      width: min(100%, 400px);
      padding: 2.5rem 2.25rem;
      border-radius: 1.75rem;
      transform: translateY(36px) scale(0.97);
      opacity: 0;
      filter: blur(8px);
      will-change: transform, opacity, filter;
      transition:
        transform 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        opacity 1.5s cubic-bezier(0.16, 1, 0.3, 1),
        filter 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible .login-card {
      transform: translateY(0) scale(1);
      opacity: 1;
      filter: blur(0);
    }
    .login-card > * {
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #login-screen.visible .login-card > * { opacity: 1; transform: translateY(0); }
    #login-screen.visible .login-card > *:nth-child(1) { transition-delay: 0.25s; }
    #login-screen.visible .login-card > *:nth-child(2) { transition-delay: 0.35s; }
    #login-screen.visible .login-card > *:nth-child(3) { transition-delay: 0.45s; }
    #login-screen.visible .login-card > *:nth-child(4) { transition-delay: 0.55s; }
    #login-screen.visible .login-card > *:nth-child(5) { transition-delay: 0.65s; }

    input {
      width: 100%;
      padding: 0.85rem 1.1rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      font-size: 0.925rem;
      color: #18181b;
      outline: none;
      transition: border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    input::placeholder { color: #a1a1aa; }
    input:focus {
      background: rgba(255, 255, 255, 0.75);
      border-color: rgba(113, 113, 122, 0.4);
      box-shadow: 0 0 0 3px rgba(113, 113, 122, 0.12);
    }

    .btn-primary {
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: 0.9rem;
      background: #27272a;
      color: #fafafa;
      font-weight: 500;
      font-size: 0.925rem;
      border: none;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease, box-shadow 0.25s ease;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }
    .btn-primary:hover { background: #18181b; box-shadow: 0 6px 20px rgba(0,0,0,0.16); }
    .btn-primary:active { transform: scale(0.985); }
    .btn-primary:disabled { opacity: 0.7; cursor: wait; }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #a1a1aa;
      font-size: 0.75rem;
      letter-spacing: 0.04em;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(113, 113, 122, 0.25);
    }

    .link {
      color: #52525b;
      text-decoration: none;
      font-size: 0.8125rem;
      transition: color 0.2s ease;
    }
    .link:hover { color: #18181b; }

    /* Dashboard */
    #dashboard-screen {
      opacity: 0;
      pointer-events: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #dashboard-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .dash-shell {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1.25rem;
      gap: 1rem;
    }

    .dash-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.25rem;
      border-radius: 1.25rem;
    }

    .host-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
      overflow-y: auto;
      padding: 0.25rem;
      flex: 1;
    }

    .host-card {
      border-radius: 1.25rem;
      padding: 1.25rem;
      cursor: pointer;
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), background 0.25s ease, box-shadow 0.35s ease;
    }
    .host-card:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.55);
      box-shadow: 0 12px 32px rgba(0,0,0,0.08);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 9999px;
      flex-shrink: 0;
    }
    .status-online { background: #34d399; box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.25); }
    .status-idle { background: #fbbf24; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.25); }
    .status-offline { background: #a1a1aa; box-shadow: 0 0 0 3px rgba(161, 161, 170, 0.2); }

    /* Host detail */
    #host-screen {
      opacity: 0;
      pointer-events: none;
      align-items: stretch;
      justify-content: stretch;
      padding: 0;
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #host-screen.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .cmd-btn {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.35rem;
      padding: 1rem 1.15rem;
      border-radius: 1rem;
      text-align: left;
      cursor: pointer;
      transition: background 0.25s ease, transform 0.2s ease;
      border: none;
      width: 100%;
      color: inherit;
      font: inherit;
    }
    .cmd-btn:hover {
      background: rgba(255, 255, 255, 0.55);
      transform: translateY(-1px);
    }
    .cmd-btn:active { transform: scale(0.99); }

    .output-panel {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      line-height: 1.55;
      color: #3f3f46;
      white-space: pre-wrap;
      min-height: 140px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.85rem;
      border-radius: 0.75rem;
      font-size: 0.8125rem;
      color: #52525b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .back-btn:hover {
      background: rgba(255,255,255,0.5);
      color: #18181b;
    }
  </style>
</head>
<body>
  <div class="bg-layer"></div>
  <div class="noise"></div>

  <!-- INTRO -->
  <div id="intro-screen" class="screen">
    <h1 class="title">Spectre</h1>
  </div>

  <!-- LOGIN -->
  <div id="login-screen" class="screen">
    <div class="login-card glass-deep">
      <div class="text-center mb-8">
        <h2 class="font-serif italic text-3xl text-zinc-800 tracking-tight">Spectre</h2>
        <p class="mt-2 text-sm text-zinc-500">Sign in to continue</p>
      </div>

      <form id="login-form" class="space-y-4" onsubmit="handleLogin(event)">
        <div>
          <label class="block text-xs font-medium text-zinc-500 mb-1.5 ml-0.5">Email</label>
          <input type="email" name="email" placeholder="you@example.com" required autocomplete="email" value="operator@spectre.local" />
        </div>
        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label class="text-xs font-medium text-zinc-500 ml-0.5">Password</label>
            <a href="#" class="link">Forgot?</a>
          </div>
          <input type="password" name="password" placeholder="••••••••" required autocomplete="current-password" value="spectre" />
        </div>

        <button type="submit" class="btn-primary mt-2">Continue</button>
      </form>

      <div class="divider my-6">or</div>

      <button type="button" class="w-full py-2.5 rounded-xl glass text-sm font-medium text-zinc-700 hover:bg-white/60 transition flex items-center justify-center gap-2">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" class="opacity-70"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
        Continue with GitHub
      </button>

      <p class="mt-7 text-center text-xs text-zinc-500">
        Demo: any credentials work · prefilled for speed
      </p>
    </div>
  </div>

  <!-- DASHBOARD: Hosts -->
  <div id="dashboard-screen" class="screen">
    <div class="dash-shell">
      <header class="dash-header glass-deep">
        <div class="flex items-center gap-3">
          <span class="font-serif italic text-xl text-zinc-800">Spectre</span>
          <span class="text-xs text-zinc-400 px-2 py-0.5 rounded-full glass-soft">operator</span>
        </div>
        <div class="flex items-center gap-4 text-sm text-zinc-500">
          <span><span id="online-count">3</span> online</span>
          <button onclick="logout()" class="link">Sign out</button>
        </div>
      </header>

      <div class="px-1">
        <h1 class="text-lg font-medium text-zinc-800">Hosts</h1>
        <p class="text-sm text-zinc-500 mt-0.5">Clients under control</p>
      </div>

      <div class="host-grid" id="host-grid"></div>
    </div>
  </div>

  <!-- HOST DETAIL -->
  <div id="host-screen" class="screen">
    <div class="dash-shell">
      <header class="dash-header glass-deep">
        <div class="flex items-center gap-3">
          <button class="back-btn" onclick="backToHosts()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
            Hosts
          </button>
          <div class="h-4 w-px bg-zinc-300"></div>
          <div class="flex items-center gap-2">
            <span id="host-status-dot" class="status-dot status-online"></span>
            <span id="host-name" class="font-medium text-zinc-800">—</span>
          </div>
        </div>
        <div class="text-sm text-zinc-500" id="host-meta">—</div>
      </header>

      <div class="flex-1 grid lg:grid-cols-[1fr_1.1fr] gap-4 min-h-0 overflow-hidden">
        <!-- Commands -->
        <div class="glass-deep rounded-2xl p-5 flex flex-col min-h-0 overflow-hidden">
          <h2 class="text-sm font-medium text-zinc-600 mb-3">Commands</h2>
          <div class="grid sm:grid-cols-2 gap-2 overflow-y-auto pr-1" id="cmd-grid"></div>
        </div>

        <!-- Output -->
        <div class="glass-deep rounded-2xl p-5 flex flex-col min-h-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-medium text-zinc-600">Output</h2>
            <button onclick="clearOutput()" class="text-xs text-zinc-400 hover:text-zinc-600 transition">Clear</button>
          </div>
          <div class="glass-soft rounded-xl p-4 flex-1 overflow-y-auto">
            <div class="output-panel" id="output">Ready. Select a command.</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ── Fake hosts ──────────────────────────────────────────────
    const hosts = [
      {
        id: 'h1',
        name: 'WORKSTATION-04',
        os: 'Windows 11 Pro',
        ip: '10.0.14.22',
        user: 'j.miller',
        status: 'online',
        lastSeen: 'Just now',
        latency: '18 ms'
      },
      {
        id: 'h2',
        name: 'macbook-pro-m2',
        os: 'macOS Sequoia',
        ip: '10.0.14.41',
        user: 'a.chen',
        status: 'online',
        lastSeen: '12s ago',
        latency: '24 ms'
      },
      {
        id: 'h3',
        name: 'ubuntu-build-07',
        os: 'Ubuntu 24.04 LTS',
        ip: '10.0.15.8',
        user: 'deploy',
        status: 'online',
        lastSeen: 'Just now',
        latency: '11 ms'
      },
      {
        id: 'h4',
        name: 'DESKTOP-FINANCE',
        os: 'Windows 10 Enterprise',
        ip: '10.0.12.90',
        user: 'r.patel',
        status: 'idle',
        lastSeen: '4m ago',
        latency: '—'
      },
      {
        id: 'h5',
        name: 'lab-pi-03',
        os: 'Raspberry Pi OS',
        ip: '10.0.20.3',
        user: 'pi',
        status: 'offline',
        lastSeen: '2h ago',
        latency: '—'
      }
    ];

    const commands = [
      { id: 'sysinfo', label: 'System info', desc: 'OS, CPU, memory, uptime' },
      { id: 'shell', label: 'Shell', desc: 'Open interactive shell' },
      { id: 'screenshot', label: 'Screenshot', desc: 'Capture current display' },
      { id: 'processes', label: 'Processes', desc: 'List running processes' },
      { id: 'files', label: 'File browser', desc: 'Browse remote filesystem' },
      { id: 'net', label: 'Network', desc: 'Interfaces, connections' },
      { id: 'clipboard', label: 'Clipboard', desc: 'Read remote clipboard' },
      { id: 'keylog', label: 'Input log', desc: 'Keystroke buffer (placeholder)' },
      { id: 'persist', label: 'Persistence', desc: 'Check / manage implants' },
      { id: 'transfer', label: 'Transfer', desc: 'Upload / download files' }
    ];

    const fakeOutputs = {
      sysinfo: `Hostname: {{name}}
OS:        {{os}}
User:      {{user}}
IP:        {{ip}}
Uptime:    14h 22m
CPU:       12% · 8 cores
Memory:    6.4 / 16 GB
Disk:      128 GB free`,
      shell: `$ whoami
{{user}}
$ pwd
/home/{{user}}
$ # interactive shell placeholder`,
      screenshot: `[screenshot] Captured primary display (1920×1080)
Saved → /tmp/spectre_shot_{{id}}.png
(placeholder — no real capture)`,
      processes: `PID   NAME              CPU    MEM
1284  explorer.exe      0.4%   48M
2401  chrome.exe        12%    610M
3012  Code.exe          3.1%   290M
… (placeholder list)`,
      files: `/home/{{user}}
  Documents/
  Downloads/
  .config/
  notes.txt
(placeholder file tree)`,
      net: `eth0  {{ip}}  up
tcp   443  established  ×4
tcp   22   listening
(placeholder)`,
      clipboard: `[clipboard] "meeting notes – Q4 roadmap"
(placeholder)`,
      keylog: `[input] buffer empty · last activity 2m ago
(placeholder)`,
      persist: `Implant: spectre-agent v0.1
Status:  running
Method:  (placeholder)
Last check-in: {{lastSeen}}`,
      transfer: `Ready for transfer.
Drag files here or use put / get.
(placeholder)`
    };

    let currentHost = null;

    // ── Screens ─────────────────────────────────────────────────
    const intro = document.getElementById('intro-screen');
    const login = document.getElementById('login-screen');
    const dash = document.getElementById('dashboard-screen');
    const hostScreen = document.getElementById('host-screen');

    setTimeout(() => login.classList.add('visible'), 3000);

    function handleLogin(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button[type="submit"]');
      btn.textContent = 'Entering…';
      btn.disabled = true;

      setTimeout(() => {
        login.classList.add('fade-out');
        setTimeout(() => {
          login.classList.remove('visible', 'fade-out');
          login.style.display = 'none';
          intro.style.display = 'none';
          renderHosts();
          dash.classList.add('visible');
        }, 700);
      }, 600);
    }

    function logout() {
      location.reload();
    }

    function renderHosts() {
      const grid = document.getElementById('host-grid');
      const online = hosts.filter(h => h.status === 'online').length;
      document.getElementById('online-count').textContent = online;

      grid.innerHTML = hosts.map(h => `
        <div class="host-card glass" onclick="openHost('${h.id}')">
          <div class="flex items-start justify-between gap-2 mb-3">
            <div class="flex items-center gap-2 min-w-0">
              <span class="status-dot status-${h.status}"></span>
              <span class="font-medium text-zinc-800 truncate">${h.name}</span>
            </div>
            <span class="text-[11px] text-zinc-400 uppercase tracking-wide">${h.status}</span>
          </div>
          <div class="space-y-1 text-sm text-zinc-500">
            <div class="truncate">${h.os}</div>
            <div class="flex justify-between gap-2">
              <span>${h.ip}</span>
              <span class="text-zinc-400">${h.user}</span>
            </div>
            <div class="text-xs text-zinc-400 pt-1">${h.lastSeen}${h.latency !== '—' ? ' · ' + h.latency : ''}</div>
          </div>
        </div>
      `).join('');
    }

    function openHost(id) {
      currentHost = hosts.find(h => h.id === id);
      if (!currentHost) return;

      document.getElementById('host-name').textContent = currentHost.name;
      document.getElementById('host-meta').textContent =
        `${currentHost.os} · ${currentHost.ip} · ${currentHost.user}`;

      const dot = document.getElementById('host-status-dot');
      dot.className = `status-dot status-${currentHost.status}`;

      const cmdGrid = document.getElementById('cmd-grid');
      cmdGrid.innerHTML = commands.map(c => `
        <button class="cmd-btn glass-soft" onclick="runCommand('${c.id}')">
          <span class="font-medium text-zinc-800 text-sm">${c.label}</span>
          <span class="text-xs text-zinc-500">${c.desc}</span>
        </button>
      `).join('');

      document.getElementById('output').textContent = 'Ready. Select a command.';

      dash.classList.remove('visible');
      setTimeout(() => {
        hostScreen.classList.add('visible');
      }, 200);
    }

    function backToHosts() {
      hostScreen.classList.remove('visible');
      setTimeout(() => {
        dash.classList.add('visible');
      }, 200);
    }

    function runCommand(id) {
      const tpl = fakeOutputs[id] || 'Command acknowledged (placeholder).';
      const h = currentHost;
      const text = tpl
        .replaceAll('{{name}}', h.name)
        .replaceAll('{{os}}', h.os)
        .replaceAll('{{user}}', h.user)
        .replaceAll('{{ip}}', h.ip)
        .replaceAll('{{id}}', h.id)
        .replaceAll('{{lastSeen}}', h.lastSeen);

      const out = document.getElementById('output');
      out.textContent = 'Running…';
      setTimeout(() => {
        out.textContent = text;
      }, 350 + Math.random() * 400);
    }

    function clearOutput() {
      document.getElementById('output').textContent = 'Ready. Select a command.';
    }
  </script>
</body>
</html>
